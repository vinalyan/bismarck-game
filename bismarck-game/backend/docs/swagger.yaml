basePath: /api
definitions:
  bismarck-game_backend_internal_game_models.AvailableMovesResponse:
    properties:
      available_hexes:
        items:
          type: string
        type: array
      current_hex:
        type: string
      fuel_costs:
        additionalProperties:
          type: integer
        description: Гекс -> стоимость топлива
        type: object
      max_distance:
        type: integer
      unit_id:
        type: string
    type: object
  bismarck-game_backend_internal_game_models.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 6
        type: string
    required:
    - current_password
    - new_password
    type: object
  bismarck-game_backend_internal_game_models.CreateGameRequest:
    properties:
      name:
        maxLength: 100
        minLength: 3
        type: string
      password:
        type: string
      settings:
        $ref: '#/definitions/bismarck-game_backend_internal_game_models.GameSettings'
      side:
        allOf:
        - $ref: '#/definitions/bismarck-game_backend_internal_game_models.PlayerSide'
        enum:
        - german
        - allied
    required:
    - name
    - side
    type: object
  bismarck-game_backend_internal_game_models.CreateUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  bismarck-game_backend_internal_game_models.GameSettings:
    properties:
      allow_spectators:
        type: boolean
      auto_save:
        type: boolean
      difficulty:
        type: string
      enable_crew_exhaustion:
        type: boolean
      max_turn_time:
        description: в минутах
        type: integer
      password:
        type: string
      private_lobby:
        type: boolean
      time_limit_minutes:
        type: integer
      use_optional_units:
        type: boolean
      victory_conditions:
        $ref: '#/definitions/bismarck-game_backend_internal_game_models.VictoryConfig'
    type: object
  bismarck-game_backend_internal_game_models.JoinGameRequest:
    properties:
      password:
        type: string
      side:
        allOf:
        - $ref: '#/definitions/bismarck-game_backend_internal_game_models.PlayerSide'
        description: Желаемая сторона (german или allied)
    type: object
  bismarck-game_backend_internal_game_models.LastKnownPosition:
    properties:
      last_seen_at:
        type: string
      owner:
        type: string
      position:
        type: string
      unit_id:
        type: string
      unit_type:
        $ref: '#/definitions/bismarck-game_backend_internal_game_models.UnitType'
    type: object
  bismarck-game_backend_internal_game_models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  bismarck-game_backend_internal_game_models.Movement:
    properties:
      created_at:
        type: string
      from_hex:
        type: string
      fuel_cost:
        type: integer
      game_id:
        type: string
      hexes_moved:
        type: integer
      id:
        type: string
      movement_type:
        $ref: '#/definitions/bismarck-game_backend_internal_game_models.MovementType'
      path:
        description: Путь движения (массив гексов)
        items:
          type: string
        type: array
      phase:
        type: string
      to_hex:
        type: string
      turn:
        type: integer
      unit_id:
        type: string
      updated_at:
        type: string
    type: object
  bismarck-game_backend_internal_game_models.MovementHistory:
    properties:
      created_at:
        type: string
      game_id:
        type: string
      hexes_moved:
        type: integer
      id:
        type: string
      phase:
        type: string
      turn:
        type: integer
      unit_id:
        type: string
    type: object
  bismarck-game_backend_internal_game_models.MovementRequest:
    properties:
      path:
        description: Опциональный путь, если не указан - будет рассчитан
        items:
          type: string
        type: array
      to_hex:
        type: string
      unit_id:
        type: string
    required:
    - to_hex
    - unit_id
    type: object
  bismarck-game_backend_internal_game_models.MovementResponse:
    properties:
      fuel_cost:
        type: integer
      message:
        type: string
      movement:
        $ref: '#/definitions/bismarck-game_backend_internal_game_models.Movement'
      new_position:
        type: string
      success:
        type: boolean
    type: object
  bismarck-game_backend_internal_game_models.MovementType:
    enum:
    - normal
    - pursued
    - emergency
    type: string
    x-enum-comments:
      MovementTypeEmergency: Аварийное движение (при нехватке топлива)
      MovementTypeNormal: Обычное движение
      MovementTypePursued: Движение преследуемого юнита
    x-enum-descriptions:
    - Обычное движение
    - Движение преследуемого юнита
    - Аварийное движение (при нехватке топлива)
    x-enum-varnames:
    - MovementTypeNormal
    - MovementTypePursued
    - MovementTypeEmergency
  bismarck-game_backend_internal_game_models.PlayerSide:
    enum:
    - german
    - allied
    type: string
    x-enum-varnames:
    - PlayerSideGerman
    - PlayerSideAllied
  bismarck-game_backend_internal_game_models.UnitType:
    enum:
    - BB
    - BC
    - CV
    - CA
    - CL
    - DD
    - CG
    - TK
    - B
    - R
    type: string
    x-enum-varnames:
    - UnitTypeBattleship
    - UnitTypeBattlecruiser
    - UnitTypeAircraftCarrier
    - UnitTypeHeavyCruiser
    - UnitTypeLightCruiser
    - UnitTypeDestroyer
    - UnitTypeCoastGuard
    - UnitTypeTanker
    - UnitTypeCombatAircraft
    - UnitTypeReconAircraft
  bismarck-game_backend_internal_game_models.UnitVisibility:
    enum:
    - unknown
    - sighted
    - shadowed
    type: string
    x-enum-comments:
      VisibilityShadowed: Юнит преследуется (маркер "Преследуется")
      VisibilitySighted: Юнит обнаружен (маркер "Обнаружено")
      VisibilityUnknown: Юнит не обнаружен
    x-enum-descriptions:
    - Юнит не обнаружен
    - Юнит обнаружен (маркер "Обнаружено")
    - Юнит преследуется (маркер "Преследуется")
    x-enum-varnames:
    - VisibilityUnknown
    - VisibilitySighted
    - VisibilityShadowed
  bismarck-game_backend_internal_game_models.UpdateUserRequest:
    properties:
      email:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
  bismarck-game_backend_internal_game_models.VictoryConfig:
    properties:
      bismarck_end_game_vp:
        type: integer
      bismarck_france_vp:
        type: integer
      bismarck_no_fuel_vp:
        type: integer
      bismarck_norway_vp:
        type: integer
      bismarck_sunk_vp:
        type: integer
      convoy_vp:
        additionalProperties: true
        type: object
      ship_vp_values:
        additionalProperties: true
        type: object
    type: object
  bismarck-game_backend_internal_game_models.VisibilityResponse:
    properties:
      last_known_positions:
        items:
          $ref: '#/definitions/bismarck-game_backend_internal_game_models.LastKnownPosition'
        type: array
      phase:
        type: string
      turn:
        type: integer
      visible_units:
        items:
          $ref: '#/definitions/bismarck-game_backend_internal_game_models.VisibleUnit'
        type: array
    type: object
  bismarck-game_backend_internal_game_models.VisibilityUpdate:
    properties:
      hex:
        description: Позиция, где был обнаружен юнит
        type: string
      unit_id:
        type: string
      visibility:
        $ref: '#/definitions/bismarck-game_backend_internal_game_models.UnitVisibility'
    required:
    - unit_id
    - visibility
    type: object
  bismarck-game_backend_internal_game_models.VisibleUnit:
    properties:
      last_seen_at:
        type: string
      owner:
        type: string
      position:
        type: string
      unit_id:
        type: string
      unit_type:
        $ref: '#/definitions/bismarck-game_backend_internal_game_models.UnitType'
      visibility:
        $ref: '#/definitions/bismarck-game_backend_internal_game_models.UnitVisibility'
    type: object
  internal_api_handlers.CheckEmergencyFuelRequest:
    properties:
      game_id:
        type: string
      unit_id:
        type: string
    type: object
  internal_api_handlers.CheckEmergencyFuelResponse:
    properties:
      current_fuel:
        type: integer
      emergency_turn:
        type: integer
      is_emergency_fuel:
        type: boolean
      message:
        type: string
      success:
        type: boolean
    type: object
  internal_api_handlers.RefuelAllRequest:
    properties:
      fuel_amount:
        type: integer
      game_id:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Bismarck Game Team
  description: API для игры Bismarck Chase - пошаговой стратегической игры о морских
    сражениях
  title: Bismarck Game API
  version: "1.0"
